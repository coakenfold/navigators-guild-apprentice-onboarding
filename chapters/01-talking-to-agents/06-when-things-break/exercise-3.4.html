<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timer | make it liminal | 4/5</title>
    <style>
      :root {
        --wall: #c9b95a;
        --wall-dark: #8f8337;
        --light: #f4f0c8;
        --ink: #2b2a14;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
        color: var(--ink);
        background:
      /* ceiling light pool */
          radial-gradient(
            ellipse 70% 50% at 50% 0%,
            rgba(255, 252, 210, 0.75),
            transparent 70%
          ),
          /* vertical wallpaper stripes */
          repeating-linear-gradient(
              90deg,
              var(--wall) 0 38px,
              #bfae4f 38px 40px,
              var(--wall) 40px 78px,
              #b5a448 78px 80px
            ),
          var(--wall);
        animation: hum 6s ease-in-out infinite;
      }
      /* carpet floor */
      body::before {
        content: "";
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 22vh;
        background: repeating-linear-gradient(
          0deg,
          #6d6224 0 3px,
          #75692a 3px 6px
        );
        box-shadow:
          0 -6px 0 #4a4118,
          0 -40px 60px rgba(0, 0, 0, 0.25);
      }
      /* vignette + VHS grain + scanlines */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.07) 0 1px,
            transparent 1px 3px
          ),
          radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(20, 16, 0, 0.65) 100%
          );
        mix-blend-mode: multiply;
      }
      @keyframes hum {
        0%,
        100% {
          filter: brightness(1);
        }
        50% {
          filter: brightness(0.94);
        }
      }
      @keyframes flicker {
        0%,
        18%,
        22%,
        60%,
        64%,
        100% {
          opacity: 1;
        }
        20% {
          opacity: 0.35;
        }
        62% {
          opacity: 0.6;
        }
        63% {
          opacity: 0.2;
        }
      }

      main {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 1rem;
      }
      .sign {
        display: inline-block;
        padding: 1.2rem 2.4rem 1rem;
        background: var(--light);
        border: 6px solid #d7d2a8;
        box-shadow:
          0 0 0 2px #7f7a52,
          0 20px 40px rgba(0, 0, 0, 0.35),
          0 0 120px rgba(255, 250, 200, 0.35);
      }
      .label {
        font-size: 0.8rem;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        opacity: 0.6;
        margin-bottom: 0.2rem;
      }
      #display {
        font-size: clamp(3.5rem, 16vw, 8rem);
        letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums;
        color: #3a3a1c;
        text-shadow:
          0 0 1px rgba(0, 0, 0, 0.5),
          2px 0 rgba(255, 0, 0, 0.18),
          -2px 0 rgba(0, 120, 255, 0.18);
        display: inline-block;
      }
      #display.running {
        animation: drift 9s ease-in-out infinite;
      }
      @keyframes drift {
        0%,
        100% {
          transform: translateY(0);
          opacity: 1;
        }
        50% {
          transform: translateY(-3px);
          opacity: 0.88;
        }
      }
      #display.done {
        animation: flicker 1.7s steps(1) infinite;
      }
      .note {
        margin-top: 0.4rem;
        font-size: 0.85rem;
        opacity: 0.55;
        min-height: 1.2em;
        letter-spacing: 0.15em;
      }

      .controls {
        margin-top: 1.4rem;
        display: flex;
        gap: 0.6rem;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
      }
      input {
        width: 3.8rem;
        font: inherit;
        font-size: 1.4rem;
        text-align: center;
        padding: 0.2rem;
        background: var(--light);
        color: var(--ink);
        border: 2px solid #7f7a52;
      }
      button {
        font: inherit;
        font-size: 1rem;
        letter-spacing: 0.15em;
        text-transform: lowercase;
        padding: 0.5rem 1.2rem;
        margin: 0.3rem 0.2rem;
        cursor: pointer;
        background: var(--light);
        color: var(--ink);
        border: 2px solid #7f7a52;
        box-shadow: 2px 2px 0 #5d5a3a;
      }
      button:hover {
        background: #fff;
      }
      button:active {
        transform: translate(2px, 2px);
        box-shadow: none;
      }
      #hum[aria-pressed="false"] {
        opacity: 0.5;
      }

      @media (prefers-reduced-motion: reduce) {
        body,
        #display {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="sign">
        <div class="label">you are here</div>
        <div id="display">05:00</div>
        <div class="note" id="note">&nbsp;</div>
      </div>
      <div class="controls">
        <input id="min" type="number" min="0" value="5" aria-label="Minutes" />
        :
        <input
          id="sec"
          type="number"
          min="0"
          max="59"
          value="0"
          aria-label="Seconds"
        />
      </div>
      <div>
        <button id="start">start</button>
        <button id="reset">reset</button>
        <button id="hum" aria-pressed="true">hum: on</button>
      </div>
    </main>
    <script>
      const display = document.getElementById("display");
      const note = document.getElementById("note");
      const minEl = document.getElementById("min");
      const secEl = document.getElementById("sec");
      const startBtn = document.getElementById("start");
      const humBtn = document.getElementById("hum");
      let remaining = 0,
        endTime = 0,
        handle = null;

      const fmt = (s) =>
        `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
      const readInputs = () =>
        Math.max(0, (+minEl.value || 0) * 60 + (+secEl.value || 0));
      const show = (s) => {
        display.textContent = fmt(s);
        document.title = fmt(s) + " – Timer";
      };

      /* Quiet whispers that surface now and then while the timer runs */
      const WHISPERS = [
        "the hallway continues",
        "no one else is here",
        "this room feels familiar",
        "the lights have always been on",
        "time is passing, probably",
        "nothing is wrong",
        "you were already here",
        "the carpet is damp",
        "exit: not found",
      ];
      let whisperTimer = null;
      function whisper() {
        note.textContent =
          WHISPERS[Math.floor(Math.random() * WHISPERS.length)];
        setTimeout(() => {
          if (handle) note.innerHTML = "&nbsp;";
        }, 4000);
      }

      /* ---------- Ambient: fluorescent hum + slow detuned pad, long and empty ---------- */
      let ctx = null,
        humOn = true,
        nodes = null;
      function startAmbient() {
        if (!humOn || nodes) return;
        try {
          ctx = ctx || new AudioContext();
          ctx.resume();
          const master = ctx.createGain();
          master.gain.value = 0;
          master.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 3);
          // cheap reverb: feedback delay through a lowpass
          const delay = ctx.createDelay();
          delay.delayTime.value = 0.45;
          const fb = ctx.createGain();
          fb.gain.value = 0.55;
          const lp = ctx.createBiquadFilter();
          lp.type = "lowpass";
          lp.frequency.value = 1200;
          delay.connect(lp).connect(fb).connect(delay);
          master.connect(ctx.destination);
          lp.connect(master);

          const oscs = [];
          const add = (type, freq, vol, wet) => {
            const o = ctx.createOscillator(),
              g = ctx.createGain();
            o.type = type;
            o.frequency.value = freq;
            g.gain.value = vol;
            o.connect(g);
            g.connect(master);
            if (wet) g.connect(delay);
            o.start();
            oscs.push(o);
            return o;
          };
          add("sawtooth", 60, 0.035, false); // mains hum
          add("sawtooth", 120.4, 0.02, false); // 2nd harmonic, slightly off
          add("sine", 196.0, 0.06, true); // pad: open fifth, detuned
          add("sine", 196.9, 0.06, true);
          add("sine", 293.7, 0.04, true);
          add("sine", 294.6, 0.04, true);
          // slow tremolo on the pad
          const lfo = ctx.createOscillator(),
            lg = ctx.createGain();
          lfo.frequency.value = 0.12;
          lg.gain.value = 0.15;
          lfo.connect(lg).connect(master.gain);
          lfo.start();
          oscs.push(lfo);
          nodes = { master, oscs };
        } catch (e) {}
      }
      function stopAmbient() {
        if (!nodes) return;
        const { master, oscs } = nodes;
        nodes = null;
        const t = ctx.currentTime;
        master.gain.cancelScheduledValues(t);
        master.gain.setValueAtTime(master.gain.value, t);
        master.gain.linearRampToValueAtTime(0, t + 1.5);
        setTimeout(
          () =>
            oscs.forEach((o) => {
              try {
                o.stop();
              } catch (e) {}
            }),
          1700,
        );
      }
      function doneChime() {
        // a single distant, lonely tone
        try {
          ctx = ctx || new AudioContext();
          const t = ctx.currentTime,
            o = ctx.createOscillator(),
            g = ctx.createGain();
          o.type = "sine";
          o.frequency.value = 523.25;
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.25, t + 0.05);
          g.gain.exponentialRampToValueAtTime(0.001, t + 4);
          o.connect(g).connect(ctx.destination);
          o.start(t);
          o.stop(t + 4);
        } catch (e) {}
      }

      /* ---------- Timer ---------- */
      function tick() {
        remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
        show(remaining);
        if (remaining === 0) {
          clearInterval(handle);
          handle = null;
          clearInterval(whisperTimer);
          stopAmbient();
          display.classList.remove("running");
          display.classList.add("done");
          note.textContent = "time has stopped. you may stay.";
          startBtn.textContent = "start";
          doneChime();
        }
      }

      startBtn.onclick = () => {
        if (handle) {
          // pause
          clearInterval(handle);
          handle = null;
          clearInterval(whisperTimer);
          stopAmbient();
          display.classList.remove("running");
          note.textContent = "paused. nothing moves.";
          startBtn.textContent = "resume";
          return;
        }
        if (!remaining) remaining = readInputs();
        if (!remaining) return;
        display.classList.remove("done");
        display.classList.add("running");
        note.innerHTML = "&nbsp;";
        startAmbient();
        whisperTimer = setInterval(whisper, 17000);
        endTime = Date.now() + remaining * 1000;
        handle = setInterval(tick, 250);
        startBtn.textContent = "pause";
        tick();
      };

      document.getElementById("reset").onclick = () => {
        clearInterval(handle);
        handle = null;
        clearInterval(whisperTimer);
        remaining = 0;
        stopAmbient();
        display.classList.remove("done", "running");
        note.innerHTML = "&nbsp;";
        startBtn.textContent = "start";
        show(readInputs());
      };

      humBtn.onclick = () => {
        humOn = !humOn;
        humBtn.setAttribute("aria-pressed", humOn);
        humBtn.textContent = "hum: " + (humOn ? "on" : "off");
        if (!humOn) stopAmbient();
        else if (handle) startAmbient();
      };

      [minEl, secEl].forEach(
        (el) =>
          (el.oninput = () => {
            if (!handle) {
              remaining = 0;
              show(readInputs());
            }
          }),
      );
    </script>
  </body>
</html>
