<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookmarks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>My Bookmarks</h1>
  </header>

  <main>
    <section class="panel">
      <button type="button" id="form-toggle" class="form-toggle" aria-expanded="false" aria-controls="bookmark-form">
        <span class="form-toggle-icon" aria-hidden="true">+</span>
        <span id="form-toggle-label"><span class="roll-text">Add a bookmark</span></span>
      </button>
      <form id="bookmark-form" aria-labelledby="form-heading" novalidate hidden>
        <h2 id="form-heading" class="form-heading">Add a bookmark</h2>

        <label for="url">URL</label>
        <input type="url" id="url" name="url" placeholder="https://..." required>

        <label for="title">Title</label>
        <input type="text" id="title" name="title" required>

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="3"></textarea>

        <label for="tags">Tags</label>
        <input type="text" id="tags" name="tags" placeholder="comma, separated">

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <div class="form-actions">
          <button type="button" id="form-cancel" class="secondary">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="filters">
        <label for="search" class="visually-hidden">Search bookmarks</label>
        <input type="search" id="search" class="search" placeholder="Search bookmarks...">
        <div id="tag-filter" class="tags tag-filter" role="group" aria-label="Filter by tag"></div>
      </div>
      <p id="save-status" class="save-status" role="status" hidden></p>
      <ul id="bookmark-list" class="bookmark-list"></ul>
      <p id="empty-message" class="empty-message" hidden>No bookmarks yet. Add your first one above.</p>
    </section>
  </main>

  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="icon-edit" viewBox="0 0 24 24">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path d="M3 6h18"/>
      <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      <path d="M10 11v6"/>
      <path d="M14 11v6"/>
    </symbol>
  </svg>

  <template id="bookmark-template">
    <li class="bookmark">
      <div class="bookmark-header">
        <div class="bookmark-heading">
          <a class="bookmark-title" target="_blank" rel="noopener noreferrer"></a>
          <span class="bookmark-domain"></span>
        </div>
        <span class="bookmark-date"></span>
      </div>
      <div class="bookmark-url"></div>
      <p class="bookmark-notes"></p>
      <div class="tags"></div>
      <div class="bookmark-actions">
        <button type="button" class="edit-button" title="Edit">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-edit"/></svg>
        </button>
        <button type="button" class="delete-button" title="Delete">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><use href="#icon-trash"/></svg>
        </button>
      </div>
    </li>
  </template>

  <!-- Inline edit form, shown inside a bookmark's card. Only one bookmark is
       edited at a time, so its ids are unique on the page. -->
  <template id="edit-template">
    <form class="edit-form" aria-labelledby="edit-heading" novalidate>
      <h3 id="edit-heading" class="form-heading"></h3>

      <label for="edit-url">URL</label>
      <input type="url" id="edit-url" name="url" required>

      <label for="edit-title">Title</label>
      <input type="text" id="edit-title" name="title" required>

      <label for="edit-notes">Notes</label>
      <textarea id="edit-notes" name="notes" rows="3"></textarea>

      <label for="edit-tags">Tags</label>
      <input type="text" id="edit-tags" name="tags">

      <p id="edit-error" class="form-error" role="alert" hidden></p>

      <div class="form-actions">
        <button type="button" class="secondary edit-cancel">Discard changes</button>
        <button type="submit">Save changes</button>
      </div>
    </form>
  </template>

  <script src="app.js"></script>
</body>
</html>
