<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookmarks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>My Bookmarks</h1>
  </header>

  <main>
    <section class="panel">
      <h2>Add a bookmark</h2>
      <form id="bookmark-form" novalidate>
        <label for="url">URL</label>
        <input type="url" id="url" name="url" placeholder="https://..." required>

        <label for="title">Title</label>
        <input type="text" id="title" name="title" required>

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="3"></textarea>

        <label for="tags">Tags</label>
        <input type="text" id="tags" name="tags" placeholder="comma, separated">

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <div class="form-actions">
          <button type="submit">Save</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="filters">
        <input type="search" id="search" class="search" placeholder="Search bookmarks..." aria-label="Search bookmarks">
        <div id="tag-filter" class="tags tag-filter" aria-label="Filter by tag"></div>
      </div>
      <ul id="bookmark-list" class="bookmark-list"></ul>
      <p id="empty-message" class="empty-message" hidden>No bookmarks yet. Add your first one above.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
