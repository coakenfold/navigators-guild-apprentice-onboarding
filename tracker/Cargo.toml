[package]
name = "tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "1.0.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
