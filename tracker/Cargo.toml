[package]
name = "tracker"
version = "0.1.0"
edition = "2024"
# File::lock needs 1.89, and `if let … &&` chains 1.88.
rust-version = "1.89"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "1.0.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[dev-dependencies]
assert_cmd = "2.2.2"
jsonschema = { version = "0.61.2", default-features = false }
tempfile = "3.27.0"
